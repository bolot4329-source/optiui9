name: Build UltraCore APK
 
on:
  push:
    branches: [ "main", "master" ]
    # A tag like v2.3.0 also publishes a GitHub Release with the APK.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-24.04
 
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5
 
      - name: 2. Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
 
      - name: 3. Accept Android SDK Licenses (Pre-installed SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
 
      - name: 4. Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
 
      - name: 5a. Decode release key (only if all secrets are set)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ultracore-release.jks"
            # A broken secret must fail here, not produce an empty keystore.
            test -s "$RUNNER_TEMP/ultracore-release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/ultracore-release.jks" >> "$GITHUB_ENV"
            echo "Release key: real key from secrets"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A public release must be signed with the real key: add all four RELEASE_* secrets first"
              exit 1
            fi
            echo "::warning::RELEASE_* secrets are not fully set: release APK is signed with the public debug key"
          fi

      - name: 5. Build Debug and Release APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon
 
      - name: 6. Rename APK with Commit SHA
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/UltraCore-debug-${GITHUB_SHA::7}.apk"
          # Tag builds are named by version (UltraCore-v2.3.0.apk), others by commit.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="$GITHUB_REF_NAME"; else NAME="${GITHUB_SHA::7}"; fi
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/UltraCore-$NAME.apk"
 
      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: UltraCore-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: 8. Upload Release APK (faster, recommended)
        uses: actions/upload-artifact@v6
        with:
          name: UltraCore-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: 9. Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: UltraCore ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
