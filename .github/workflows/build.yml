name: Build UltraCore APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой "Run workflow"

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Debug APK (Android 17 / S25 Ultra)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: 5. Setup Gradle 8.10.2 (No wrapper jar required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: 6. Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 7. Rename APK with Commit SHA
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk "UltraCore-S25U-${GITHUB_SHA::7}.apk"

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraCore-Android17-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
