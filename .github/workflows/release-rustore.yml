name: Release to RuStore

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      submit:
        description: "Отправить версию на модерацию (false = только черновик)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_type:
        description: "Тип публикации после модерации"
        required: true
        default: "INSTANTLY"
        type: choice
        options: ["INSTANTLY", "MANUAL", "DELAYED"]
      priority_update:
        description: "Приоритет обновления (0-5)"
        required: true
        default: "0"
        type: choice
        options: ["0", "1", "2", "3", "4", "5"]
      whats_new:
        description: "Текст «Что нового» (пусто = docs/RELEASE_NOTES.md)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: rustore-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Сборка и публикация в RuStore
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости скрипта публикации
        run: pip install requests cryptography

      - name: Подготовить keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета RELEASE_KEYSTORE_BASE64: публикация в RuStore требует релизной подписи"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ultracore-release.jks"
          test -s "$RUNNER_TEMP/ultracore-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/ultracore-release.jks" >> "$GITHUB_ENV"

      - name: Собрать подписанный release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Найти собранный файл
        id: artifact
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Найден файл: $APK_PATH"

      - name: Подготовить CA-бандл (системный + НУЦ Минцифры)
        run: |
          cat /etc/ssl/certs/ca-certificates.crt \
              scripts/certs/russian_trusted_ca.pem > "$RUNNER_TEMP/rustore_ca.pem"
          echo "REQUESTS_CA_BUNDLE=$RUNNER_TEMP/rustore_ca.pem" >> "$GITHUB_ENV"

      - name: Текст «Что нового»
        id: changelog
        run: |
          if [ -n "${{ inputs.whats_new }}" ]; then
            echo "${{ inputs.whats_new }}" > "$RUNNER_TEMP/whats_new.txt"
          elif [ -f docs/RELEASE_NOTES.md ]; then
            head -c 5000 docs/RELEASE_NOTES.md > "$RUNNER_TEMP/whats_new.txt"
          else
            echo "" > "$RUNNER_TEMP/whats_new.txt"
          fi
          echo "file=$RUNNER_TEMP/whats_new.txt" >> "$GITHUB_OUTPUT"

      - name: Опубликовать в RuStore
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          RUSTORE_PACKAGE_NAME: "com.ultracore.app"
        run: |
          SUBMIT_FLAG="--submit"
          PUBLISH_TYPE="INSTANTLY"
          PRIORITY="0"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.submit }}" = "false" ] && SUBMIT_FLAG="--no-submit"
            PUBLISH_TYPE="${{ inputs.publish_type }}"
            PRIORITY="${{ inputs.priority_update }}"
          fi
          python3 scripts/rustore_publish.py \
            --file "${{ steps.artifact.outputs.path }}" \
            --whats-new-file "${{ steps.changelog.outputs.file }}" \
            --publish-type "$PUBLISH_TYPE" \
            --priority-update "$PRIORITY" \
            $SUBMIT_FLAG

      - name: Удалить keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ultracore-release.jks"
